# The double-click installers, published.
#
# install.sh and install.ps1 compile from source, and that is the right default
# for a program that also compiles its own compute backends -- but it costs a
# toolchain, twenty minutes and a terminal. The other kind is a disk image to
# drag into Applications, a setup .exe, and an AppImage that runs where it
# lands, each leaving an icon that can be pinned to a dock or a taskbar.
#
# build.yml builds and opens all three on every push. A tag (v0.1.0) publishes
# the ones built for its commit: those of the run that passed on it already,
# or, when there is none, those of the checks this run makes. They used to be
# built here, for the first time, as the release went out. To build them
# without publishing anything, push a branch, or run build.yml by hand.
#
# A tag also builds the prebuilt runtimes (runtimes.yml) as part of this run,
# and the release goes public only once both are on it: the runtimes are put
# on a draft as soon as they are built, and the last job adds the installers
# and publishes it. The release used to go public with the installers while
# the runtimes were still building, and for that half hour an install whose
# llama.cpp tag had moved found nothing to download.
name: installers

on:
  push:
    tags: ["v*"]

# actions: read, for the run that passed on this commit and its installers.
permissions:
  contents: write
  actions: read

jobs:
  # The run that passed on this commit already, on a branch or on main, whose
  # installers are still there: a run's files are kept for a while, not for
  # ever. Its checks are not run twice, and its installers are the ones
  # published.
  checked:
    name: Checked already
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.look.outputs.run }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=""
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$GITHUB_SHA" \
                        --status success --json databaseId --jq '.[].databaseId'); do
            have="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
                      --jq '[.artifacts[] | select(.expired | not) | .name
                             | select(. == "Crucible-macOS" or . == "Crucible-Windows" or . == "Crucible-Linux")]
                            | unique | length')"
            echo "run $id passed on $GITHUB_SHA, with ${have:-0} of the three installers"
            if [ "${have:-0}" = 3 ]; then run="$id"; break; fi
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # The checks and the installers, in this run, when no run has passed on the
  # commit yet: side by side with the runtimes, and the release is published
  # only if both pass.
  checks:
    name: Checks
    needs: checked
    if: needs.checked.outputs.run == ''
    uses: ./.github/workflows/build.yml

  # The compute backends, built by runtimes.yml inside this run so the release
  # can wait for them. runtimes.yml can be run by hand on its own as well.
  runtimes:
    name: Runtimes
    uses: ./.github/workflows/runtimes.yml

  # Whatever of them built, put on the release while it is still a draft --
  # made a draft here if there is no release yet. A backend whose job failed
  # is simply not there, and the app compiles that one the way it always has.
  runtimes-attach:
    name: Attach the runtimes
    needs: runtimes
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.recipe
          draft: true

  release:
    name: Publish the release
    needs: [checked, checks, runtimes-attach]
    # Pushing the tag is the decision to release, and the run is what decides
    # whether it goes out: the checks and the installers have to have passed,
    # on the commit before or here, and the runtimes have to be on the draft,
    # whichever of them built. Anything less leaves the draft unseen.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled()
      && needs.checked.result == 'success'
      && (needs.checked.outputs.run != '' || needs.checks.result == 'success')
      && needs.runtimes-attach.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: The installers, from the run that passed on this commit
        if: needs.checked.outputs.run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: Crucible-*
          path: artifacts
          run-id: ${{ needs.checked.outputs.run }}
          github-token: ${{ github.token }}

      - name: The installers, from this run's checks
        if: needs.checked.outputs.run == ''
        uses: actions/download-artifact@v8
        with:
          pattern: Crucible-*
          path: artifacts

      # All three, or nothing goes out.
      - name: All three are here
        run: |
          ls -la artifacts/*
          test -s artifacts/Crucible-macOS/Crucible-macOS.dmg
          test -s artifacts/Crucible-Windows/Crucible-Setup.exe
          test -s artifacts/Crucible-Linux/Crucible-x86_64.AppImage

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          # Published rather than left a draft, now that everything is on it:
          # the installers are uploaded to the draft first and only then is
          # it made public, in this one step.
          draft: false
          # A tag with a dash in it (v1.0.0-pre.1) is a pre-release: never
          # Latest, so the website and everybody's update check stay on the
          # last release, which is what Crucible's own version order says too
          # (a pre-release of a version is older than the version).
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
