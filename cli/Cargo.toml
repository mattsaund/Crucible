[package]
name = "cruciblecli"
version = "1.1.0"
edition = "2021"
description = "Crucible in the terminal"
license = "MIT"

[[bin]]
name = "cruciblecli"
path = "src/main.rs"

[dependencies]
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
serde_json = "1.0.154"
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
