<?xml version="1.0" encoding="UTF-8"?>
<!--
  Crucible's mark, for the application menu.

  The two paths are the same control points as flame_path() in
  src/gui/theme.cpp, at the same proportions and in the same two colors, so the
  icon in the launcher is the mark the window draws rather than a lookalike. The
  body leans one way and the core, a little under half the size, leans the
  other, so the two edges cross rather than nest.

  The shape is measured and then fitted, rather than placed by hand: a flame is
  not symmetric and its control points overshoot the outline, so centring on the
  construction point leaves it visibly off to one side in a launcher grid.

  Regenerate from the same numbers if the flame is ever reshaped in theme.cpp.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Crucible</title>
  <rect width="256" height="256" rx="56" ry="56" fill="#0B0B0C"/>
  <path d="M 132.43 200.76 C 118.91 216.98, 99.98 219.68, 86.47 216.98 C 70.25 184.54, 75.65 146.69, 94.58 111.54 C 108.09 79.10, 124.32 57.47, 151.35 35.84 C 164.87 68.28, 172.98 103.43, 174.33 138.58 C 175.68 168.31, 181.09 192.65, 178.39 216.98 C 164.87 225.09, 145.94 216.98, 132.43 200.76 Z" fill="#FF8700"/>
  <path d="M 132.43 180.64 C 126.21 188.10, 117.50 189.35, 111.29 188.10 C 103.82 173.18, 106.31 155.77, 115.02 139.60 C 121.23 124.68, 128.70 114.73, 124.59 104.78 C 147.35 119.70, 151.08 135.87, 151.70 152.04 C 152.33 165.72, 154.81 176.91, 153.57 188.10 C 147.35 191.84, 138.65 188.10, 132.43 180.64 Z" fill="#FFAF00"/>
</svg>
