<!doctype html>
<!--
  SPDX-License-Identifier: MIT

  The interface.

  This file is only the frame: the three places things are drawn into, and
  the list of what is loaded to draw them. How it looks is style.css. What it
  does is the scripts, one per view, on top of base.js.

  Everything it can ask Crucible to do goes through window.rpc, which is
  api/surface.hpp and nothing else. It gets no access the Python orchestrator
  will not also have, which is the point of building it this way.

  At build time cmake/BundlePage.cmake replaces each reference below with the
  file it names, so what is compiled into the program is one document.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crucible</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-mark="CRUCIBLE_MARK_SRC">
  <header id="top"></header>
  <main id="main"></main>
  <div id="layer"></div>
  <div id="drop" aria-hidden="true"></div>

<script>
// A page in a webview has no console anybody is going to open, so an error
// that stops a script would otherwise be a blank window and no clue. This is
// its own script tag on purpose: a syntax error in one of the files below
// never runs a handler declared inside it.
//
// Rejections as well as errors. Most of what the page does is asynchronous,
// and a mistake inside it surfaces as a rejected promise that never reaches
// the error handler -- which is exactly how the first blank page here happened.
function crucibleFailed(what, detail) {
  document.body.innerHTML =
    '<pre style="margin:2rem;color:#FF5F00;white-space:pre-wrap"></pre>';
  document.body.firstChild.textContent = what + '\n\n' + detail;
}
window.addEventListener('unhandledrejection', (event) => {
  const reason = event.reason;
  crucibleFailed('The interface failed.', String(reason && reason.stack ? reason.stack : reason));
});
window.addEventListener('error', (event) => {
  crucibleFailed('The interface failed.',
                 String(event.message) + '\n' + String(event.filename || '') + ':' + String(event.lineno || ''));
});
</script>
<script src="render.js"></script>
<script src="base.js"></script>
<script src="shell.js"></script>
<script src="attach.js"></script>
<script src="chat.js"></script>
<script src="cook.js"></script>
<script src="create.js"></script>
<script src="history.js"></script>
<script src="settings.js"></script>
<script>
start();
</script>
</body>
</html>
